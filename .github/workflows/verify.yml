name: Verify Milestone 0

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vpnsale_test
          POSTGRES_USER: vpnsale
          POSTGRES_PASSWORD: vpnsale_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vpnsale -d vpnsale_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      VPN_SALE_ENVIRONMENT: test
      VPN_SALE_VERSION: ci-milestone0
      VPN_SALE_DATABASE_URL: postgresql+asyncpg://vpnsale:vpnsale_ci_password@localhost:5432/vpnsale_test
      VPN_SALE_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt
      - name: Run backend verification
        run: scripts/verify-backend.sh
      - name: Backend job summary
        if: always()
        run: |
          {
            echo '## Backend verification'
            echo '- Runner: ubuntu-latest'
            echo '- Python target: 3.12'
            echo '- Services: postgres:16 on 5432, redis:7 on 6379'
            echo '- Categories: format, lint, typecheck, pytest, Alembic upgrade/current/downgrade/re-upgrade, API import smoke'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: test-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache npm when lockfile exists
        if: ${{ hashFiles('package-lock.json') != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install frontend dependencies
        run: |
          node --version
          npm --version
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo '::warning::package-lock.json is absent; using temporary npm install fallback until the lockfile is generated and committed.'
            npm install
            if [ -f package-lock.json ]; then
              touch .ci-generated-package-lock
            fi
          fi
      - name: Upload generated package lock
        if: ${{ hashFiles('.ci-generated-package-lock') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Run frontend verification
        run: scripts/verify-frontend.sh
      - name: Frontend job summary
        if: always()
        run: |
          {
            echo '## Frontend verification'
            echo '- Runner: ubuntu-latest'
            echo '- Node target: 22 LTS'
            echo '- Package manager: npm'
            echo '- Lockfile cache: enabled only when package-lock.json exists'
            echo '- Categories: lint, strict TypeScript, workspace tests, real Next.js production builds, shared package validation'
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker Compose verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Docker stack verification
        run: scripts/verify-docker.sh
      - name: Docker logs on failure
        if: failure()
        run: docker compose logs --no-color postgres redis api reverse-proxy || true
      - name: Cleanup Docker stack
        if: always()
        run: docker compose down --volumes --remove-orphans || true
      - name: Docker job summary
        if: always()
        run: |
          {
            echo '## Docker verification'
            echo '- Runner: ubuntu-latest'
            echo '- Compose services: postgres, redis, api, reverse-proxy'
            echo '- Categories: docker versions, compose config, image build, health checks, reverse-proxy HTTP checks, secret marker checks, cleanup'
          } >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Security baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run repository security scan
        run: scripts/security-scan.sh
      - name: Security job summary
        if: always()
        run: |
          {
            echo '## Security baseline'
            echo '- Runner: ubuntu-latest'
            echo '- Checks: tracked .env, private keys, obvious assigned secrets, panel credential markers, subscription URLs, generated output, dependency manifest state'
            echo '- Secret values are not printed; only affected file paths are reported.'
          } >> "$GITHUB_STEP_SUMMARY"
