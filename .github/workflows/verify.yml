name: Verify Milestone 0

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend verification
    runs-on: ubuntu-latest
    env:
      VPN_SALE_ENVIRONMENT: test
      VPN_SALE_VERSION: ci-milestone0
      POSTGRES_DB: &ci_postgres_db vpnsale_test
      POSTGRES_USER: &ci_postgres_user vpnsale
      POSTGRES_PASSWORD: &ci_postgres_password vpnsale_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      VPN_SALE_REDIS_URL: redis://127.0.0.1:6379/0
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: *ci_postgres_db
          POSTGRES_USER: *ci_postgres_user
          POSTGRES_PASSWORD: *ci_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vpnsale -d vpnsale_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt
      - name: Run backend verification
        run: scripts/verify-backend.sh
      - name: Backend job summary
        if: always()
        run: |
          {
            echo '## Backend verification'
            echo '- Runner: ubuntu-latest'
            echo '- Python target: 3.12'
            echo '- Services: postgres:16 on 5432, redis:7 on 6379'
            echo '- Categories: format, lint, typecheck, pytest, Alembic upgrade/current/downgrade/re-upgrade, API import smoke'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: test-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache npm when lockfile exists
        if: ${{ hashFiles('package-lock.json') != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install frontend dependencies
        run: |
          node --version
          npm --version
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo '::warning::package-lock.json is absent; using temporary npm install fallback until the lockfile is generated and committed.'
            npm install
            if [ -f package-lock.json ]; then
              touch .ci-generated-package-lock
            fi
          fi
      - name: Upload generated package lock
        if: ${{ hashFiles('.ci-generated-package-lock') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Run frontend verification
        run: scripts/verify-frontend.sh
      - name: Frontend job summary
        if: always()
        run: |
          {
            echo '## Frontend verification'
            echo '- Runner: ubuntu-latest'
            echo '- Node target: 22 LTS'
            echo '- Package manager: npm'
            echo '- Lockfile cache: enabled only when package-lock.json exists'
            echo '- Categories: lint, strict TypeScript, workspace tests, real Next.js production builds, shared package validation'
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker Compose verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Docker stack verification
        run: scripts/verify-docker.sh
      - name: Docker logs on failure
        if: failure()
        run: docker compose logs --no-color postgres redis api reverse-proxy || true
      - name: Cleanup Docker stack
        if: always()
        run: docker compose down --volumes --remove-orphans || true
      - name: Docker job summary
        if: always()
        run: |
          {
            echo '## Docker verification'
            echo '- Runner: ubuntu-latest'
            echo '- Compose services: postgres, redis, api, reverse-proxy'
            echo '- Categories: docker versions, compose config, image build, health checks, reverse-proxy HTTP checks, secret marker checks, cleanup'
          } >> "$GITHUB_STEP_SUMMARY"

  test-server-acceptance:
    name: Restrictive checkout deployment acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shell test tools
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          command -v shellcheck >/dev/null 2>&1 || missing+=(shellcheck)
          command -v jq >/dev/null 2>&1 || missing+=(jq)
          if ((${#missing[@]})); then
            timeout --signal=TERM 180s sudo -n env DEBIAN_FRONTEND=noninteractive \
              apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            timeout --signal=TERM 180s sudo -n env DEBIAN_FRONTEND=noninteractive \
              apt-get -o Acquire::Retries=3 -o Dpkg::Use-Pty=0 install -y --no-install-recommends "${missing[@]}"
          fi
          shellcheck --version
          jq --version
      - name: Shell syntax and ShellCheck
        run: |
          bash -n scripts/{bootstrap-test-server,install-test-server,run-test-server-install,verify-test-server,reset-disposable-test-server,test-server-installer-lib,test-server-compose-json,test-test-server-lifecycle,verify-test-server-images}.sh
          shellcheck scripts/{bootstrap-test-server,install-test-server,run-test-server-install,verify-test-server,reset-disposable-test-server,test-server-installer-lib,test-server-compose-json,test-test-server-lifecycle,verify-test-server-images}.sh
      - name: Installer resume, bootstrap, and scoped reset regressions
        run: scripts/test-test-server-lifecycle.sh
      - name: Restrictive checkout images and real stack
        run: scripts/verify-test-server-images.sh
      - name: Acceptance logs
        if: failure()
        run: docker ps -a && docker compose ls && docker system df

  security:
    name: Security baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run repository security scan
        run: scripts/security-scan.sh
      - name: Security job summary
        if: always()
        run: |
          {
            echo '## Security baseline'
            echo '- Runner: ubuntu-latest'
            echo '- Checks: tracked .env, private keys, obvious assigned secrets, panel credential markers, subscription URLs, generated output, dependency manifest state'
            echo '- Secret values are not printed; only affected file paths are reported.'
          } >> "$GITHUB_STEP_SUMMARY"

  visual-qa:
    name: Deterministic visual QA
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_IDENTITY_UI_PREVIEW: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 240s npx playwright install chromium
      - run: npm run test:e2e
      - name: Upload visual QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1a1-real-product-ui
          path: |
            test-results/screenshots/
            playwright-report/
          if-no-files-found: error
