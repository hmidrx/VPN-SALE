name: Verify Platform

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend verification
    runs-on: ubuntu-latest
    env:
      VPN_SALE_ENVIRONMENT: test
      VPN_SALE_VERSION: ci
      POSTGRES_DB: &ci_postgres_db vpnsale_test
      POSTGRES_USER: &ci_postgres_user vpnsale
      POSTGRES_PASSWORD: &ci_postgres_password vpnsale_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      VPN_SALE_REDIS_URL: redis://127.0.0.1:6379/0
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: *ci_postgres_db
          POSTGRES_USER: *ci_postgres_user
          POSTGRES_PASSWORD: *ci_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vpnsale -d vpnsale_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt
      - name: Run backend verification
        run: scripts/verify-backend.sh
      - name: Backend job summary
        if: always()
        run: |
          {
            echo '## Backend verification'
            echo '- Runner: ubuntu-latest'
            echo '- Python target: 3.12'
            echo '- Services: postgres:16 on 5432, redis:7 on 6379'
            echo '- Categories: format, lint, typecheck, pytest, Alembic upgrade/current/downgrade/re-upgrade, API import smoke'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: test-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache npm when lockfile exists
        if: ${{ hashFiles('package-lock.json') != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install frontend dependencies
        run: |
          node --version
          npm --version
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo '::error::package-lock.json is required for reproducible frontend verification.'
            exit 1
          fi
      - name: Run frontend verification
        run: scripts/verify-frontend.sh
      - name: Frontend job summary
        if: always()
        run: |
          {
            echo '## Frontend verification'
            echo '- Runner: ubuntu-latest'
            echo '- Node target: 22 LTS'
            echo '- Package manager: npm with committed lockfile'
            echo '- Categories: dependency audit, lint, strict TypeScript, workspace tests, real Next.js production builds, shared package validation'
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker Compose verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Docker stack verification
        run: scripts/verify-docker.sh
      - name: Docker logs on failure
        if: failure()
        run: docker compose logs --no-color postgres redis api reverse-proxy || true
      - name: Cleanup Docker stack
        if: always()
        run: docker compose down --volumes --remove-orphans || true
      - name: Docker job summary
        if: always()
        run: |
          {
            echo '## Docker verification'
            echo '- Runner: ubuntu-latest'
            echo '- Compose services: postgres, redis, api, reverse-proxy'
            echo '- Categories: docker versions, compose config, image build, health checks, reverse-proxy HTTP checks, secret marker checks, cleanup'
          } >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Security baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run repository security scan
        run: scripts/security-scan.sh
      - name: Security job summary
        if: always()
        run: |
          {
            echo '## Security baseline'
            echo '- Runner: ubuntu-latest'
            echo '- Checks: tracked .env, private keys, obvious assigned secrets, panel credential markers, subscription URLs, generated output, dependency manifest state'
            echo '- Secret values are not printed; only affected file paths are reported.'
          } >> "$GITHUB_STEP_SUMMARY"

  verification-gate:
    name: Required verification gate
    runs-on: ubuntu-latest
    if: always()
    needs: [backend, frontend, docker, security]
    steps:
      - name: Evaluate required jobs
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          printf 'backend=%s\nfrontend=%s\ndocker=%s\nsecurity=%s\n' \
            "$BACKEND_RESULT" "$FRONTEND_RESULT" "$DOCKER_RESULT" "$SECURITY_RESULT"
          failed=0
          for result in "$BACKEND_RESULT" "$FRONTEND_RESULT" "$DOCKER_RESULT" "$SECURITY_RESULT"; do
            if [[ "$result" != "success" ]]; then
              failed=1
            fi
          done
          if (( failed != 0 )); then
            echo '::error::Required platform verification did not pass. See the failed or cancelled job logs.'
            exit 1
          fi
          echo 'All required platform verification jobs passed.'
      - name: Verification gate summary
        if: always()
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          {
            echo '## Required verification gate'
            echo "- Backend: $BACKEND_RESULT"
            echo "- Frontend: $FRONTEND_RESULT"
            echo "- Docker: $DOCKER_RESULT"
            echo "- Security: $SECURITY_RESULT"
            echo '- Merge rule: every required result must be success.'
          } >> "$GITHUB_STEP_SUMMARY"
