events {}
http {
  resolver 127.0.0.11 valid=30s ipv6=off;
  upstream api_upstream { server api:8000; }
  server {
    listen 80;
    location = /api/v1/internal/telegram { return 404; }
    location ^~ /api/v1/internal/telegram/ { return 404; }
    location = /telegram/webhook {
      client_max_body_size 256k;
      set $telegram_bot_upstream http://telegram-bot:8081;
      proxy_pass $telegram_bot_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 2s;
      proxy_read_timeout 15s;
      proxy_send_timeout 15s;
    }
    location /api/ { proxy_pass http://api_upstream/; proxy_set_header X-Request-ID $request_id; }
    location /health { proxy_pass http://api_upstream/health; proxy_set_header X-Request-ID $request_id; }
    location /ready { proxy_pass http://api_upstream/ready; proxy_set_header X-Request-ID $request_id; }
    location /version { proxy_pass http://api_upstream/version; proxy_set_header X-Request-ID $request_id; }
    location /metrics { proxy_pass http://api_upstream/metrics; proxy_set_header X-Request-ID $request_id; }
  }
}
