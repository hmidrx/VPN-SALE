services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vpnsale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vpnsale_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-vpnsale}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env.example
    environment:
      VPN_SALE_TELEGRAM_INTERNAL_TOKEN_FILE: /run/secrets/telegram-internal-token
      VPN_SALE_DATABASE_URL: ${VPN_SALE_DATABASE_URL:-postgresql+asyncpg://vpnsale:vpnsale_dev_password@postgres:5432/vpnsale}
      VPN_SALE_REDIS_URL: redis://redis:6379/0
      VPN_SALE_PUBLIC_ACCOUNT_REGISTRATION_ENABLED: "${VPN_SALE_PUBLIC_ACCOUNT_REGISTRATION_ENABLED:-false}"
      VPN_SALE_PASSWORD_ACCOUNT_LOGIN_ENABLED: "${VPN_SALE_PASSWORD_ACCOUNT_LOGIN_ENABLED:-false}"
      VPN_SALE_ACCOUNT_EMAIL_VERIFICATION_ENABLED: "${VPN_SALE_ACCOUNT_EMAIL_VERIFICATION_ENABLED:-false}"
      VPN_SALE_ACCOUNT_RECOVERY_ENABLED: "${VPN_SALE_ACCOUNT_RECOVERY_ENABLED:-false}"
      VPN_SALE_TELEGRAM_ACCOUNT_LINKING_ENABLED: "${VPN_SALE_TELEGRAM_ACCOUNT_LINKING_ENABLED:-false}"
      VPN_SALE_UNIFIED_ADMIN_IDENTITY_ENABLED: "${VPN_SALE_UNIFIED_ADMIN_IDENTITY_ENABLED:-false}"
      VPN_SALE_MANUAL_CARD_TOPUPS_ENABLED: "${VPN_SALE_MANUAL_CARD_TOPUPS_ENABLED:-false}"
    secrets: [telegram-internal-token]
    volumes:
      - private_media:/var/lib/vpnsale/private
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    env_file: .env.example
    environment:
      VPN_SALE_REDIS_URL: redis://redis:6379/0
      VPN_SALE_DATABASE_URL: ${VPN_SALE_DATABASE_URL:-postgresql+asyncpg://vpnsale:vpnsale_dev_password@postgres:5432/vpnsale}
      VPN_SALE_MANUAL_CARD_TOPUPS_ENABLED: "${VPN_SALE_MANUAL_CARD_TOPUPS_ENABLED:-false}"
      VPN_SALE_BOT_ENABLED: "${VPN_SALE_BOT_ENABLED:-false}"
      VPN_SALE_PUBLIC_APP_ORIGIN: "${VPN_SALE_PUBLIC_APP_ORIGIN:-http://localhost:3000}"
      VPN_SALE_PROVIDER_WRITES_ENABLED: "${VPN_SALE_PROVIDER_WRITES_ENABLED:-false}"
      VPN_SALE_SUPPORT_PRIVATE_UPLOAD_ROOT: /var/lib/vpnsale/private/support
    volumes:
      - private_media:/var/lib/vpnsale/private:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  telegram-bot:
    profiles: ["telegram"]
    build:
      context: .
      dockerfile: infra/docker/telegram-bot.Dockerfile
    env_file: .env.example
    environment:
      VPN_SALE_BOT_ENABLED: "${VPN_SALE_BOT_ENABLED:-false}"
      VPN_SALE_BOT_MODE: "${VPN_SALE_BOT_MODE:-disabled}"
      VPN_SALE_TELEGRAM_INTERNAL_API_URL: http://api:8000
      VPN_SALE_TELEGRAM_INTERNAL_TOKEN_FILE: /run/secrets/telegram-internal-token
      VPN_SALE_REDIS_URL: redis://redis:6379/0
    secrets: [telegram-internal-token]
    depends_on:
      api: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"

  customer-web:
    profiles: ["web"]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args: { APP_NAME: customer-web }
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  admin-web:
    profiles: ["web"]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args: { APP_NAME: admin-web }
    ports: ["3001:3000"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  reseller-web:
    profiles: ["web"]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args: { APP_NAME: reseller-web }
    ports: ["3002:3000"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  reverse-proxy:
    image: nginx:1.27-alpine
    volumes: ["./infra/reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  private_media:

secrets:
  telegram-internal-token:
    file: ${VPN_SALE_TELEGRAM_INTERNAL_TOKEN_FILE_HOST:-./secrets/telegram-internal-token}
