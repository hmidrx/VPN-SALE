services:
  postgres:
    env_file: /opt/vpn-sale-runtime/test.env
    ports: !reset []
    volumes:
      - test_server_postgres_data:/var/lib/postgresql/data
    deploy:
      resources: { limits: { memory: 512M } }
    restart: unless-stopped

  redis:
    ports: !reset []
    volumes:
      - test_server_redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    deploy:
      resources: { limits: { memory: 256M } }
    restart: unless-stopped

  api:
    env_file: /opt/vpn-sale-runtime/test.env
    environment:
      VPN_SALE_PROVIDER_WRITES_ENABLED: "false"
      VPN_SALE_FAKE_CUSTOMER_AUTH_ENABLED: "false"
      VPN_SALE_PAYMENT_FAKE_SUCCESS_PUBLIC_ENABLED: "false"
    ports: !override
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 768M } }
    restart: unless-stopped

  worker:
    profiles: []
    ports: !reset []
    env_file: /opt/vpn-sale-runtime/test.env
    environment:
      VPN_SALE_PROVIDER_WRITES_ENABLED: "false"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 384M } }
    restart: unless-stopped

  telegram-bot:
    profiles: ["telegram"]
    ports: !reset []
    env_file: /opt/vpn-sale-runtime/test.env
    environment:
      VPN_SALE_PROVIDER_WRITES_ENABLED: "false"
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 256M } }
    restart: unless-stopped

  customer-web:
    profiles: []
    env_file: /opt/vpn-sale-runtime/test.env
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        APP_NAME: customer-web
        NEXT_PUBLIC_API_BASE_URL: https://api.dr-ping.com
        NEXT_PUBLIC_CUSTOMER_API_BASE_URL: https://api.dr-ping.com
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${VPN_SALE_TELEGRAM_BOT_USERNAME:?set in /opt/vpn-sale-runtime/test.env}
        NEXT_PUBLIC_CUSTOMER_APP_NAME: ${VPN_SALE_CUSTOMER_APP_NAME:-Dr Ping}
        NEXT_PUBLIC_CUSTOMER_FAKE_TELEGRAM: "false"
    ports: !override
      - "127.0.0.1:3000:3000"
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 512M } }
    restart: unless-stopped

  admin-web:
    profiles: []
    env_file: /opt/vpn-sale-runtime/test.env
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        APP_NAME: admin-web
        NEXT_PUBLIC_API_BASE_URL: https://api.dr-ping.com
    ports: !override
      - "127.0.0.1:3001:3000"
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 512M } }
    restart: unless-stopped

  reseller-web:
    profiles: []
    env_file: /opt/vpn-sale-runtime/test.env
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        APP_NAME: reseller-web
        NEXT_PUBLIC_API_BASE_URL: https://api.dr-ping.com
    ports: !override
      - "127.0.0.1:3002:3000"
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 512M } }
    restart: unless-stopped

  reverse-proxy:
    profiles: ["disabled-in-test-server"]
    ports: !reset []

volumes:
  test_server_postgres_data:
  test_server_redis_data:
