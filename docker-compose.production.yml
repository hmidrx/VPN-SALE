services:
  api:
    env_file: /opt/vpn-sale-runtime/production.env
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    deploy:
      replicas: 2
      resources: {limits: {cpus: "1.0", memory: 768M}}
  worker:
    env_file: /opt/vpn-sale-runtime/production.env
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    networks: [default, egress]
    deploy:
      resources: {limits: {cpus: "1.0", memory: 768M}}
  telegram-bot:
    env_file: /opt/vpn-sale-runtime/production.env
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    networks: [default, egress]
  postgres:
    ports: []
    restart: unless-stopped
  redis:
    ports: []
    restart: unless-stopped
networks:
  default:
    internal: true
  egress:
    internal: false
